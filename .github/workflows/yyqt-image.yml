name: YYQT Custom Image

# Custom fork: build only the API image (the fork's changes live in api/).
# Triggered by pushing a tag containing "yyqt" (e.g. v1.17.0-yyqt, 1.17.0-yyqt.1).
# Image is published to GHCR using the built-in GITHUB_TOKEN (no extra secrets).

on:
  push:
    tags:
      - '*yyqt*'
  workflow_dispatch:

concurrency:
  group: yyqt-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-api:
    name: Build & push custom API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
